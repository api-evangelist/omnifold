name: Omnifold
description: >-
  Omnifold is an AI supply chain planning platform for physical product companies — CPGs,
  manufacturers, distributors, and retailers. The company trains a custom AI model for each
  supply chain to forecast demand, optimize inventory, and surface revenue, margin, and cash
  that traditional planning systems miss, positioning itself in the Forbes "Purpose-Built AI"
  tier and competing with Kinaxis, Blue Yonder, and o9. Omnifold was surfaced as a portfolio
  company of Bloomberg Beta and Lightspeed Venture Partners and added to the API Evangelist
  network. Omnifold publishes marketing and product content but exposes no public API,
  developer portal, SDKs, or authentication surface as of this enrichment pass.
